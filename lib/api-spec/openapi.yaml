openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Science Compiler API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: topics
    description: Topic operations
  - name: papers
    description: Paper operations
  - name: claims
    description: Claim operations
  - name: studies
    description: Study operations
  - name: evidence
    description: Evidence link operations
  - name: synthesis
    description: Claim synthesis operations
  - name: query
    description: Query operations
  - name: admin
    description: Admin and ingestion operations
  - name: usage
    description: Usage, quotas, and LLM budget
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check (legacy)
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /health/live:
    get:
      operationId: healthLive
      tags: [health]
      summary: Liveness probe
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  uptime: { type: number }
                required: [status, uptime]

  /health/ready:
    get:
      operationId: healthReady
      tags: [health]
      summary: Readiness probe
      description: 200 if DB and OpenAI are reachable; 503 otherwise.
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /health/version:
    get:
      operationId: healthVersion
      tags: [health]
      summary: Build/version info
      responses:
        "200":
          description: Version info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"

  /admin/observability:
    get:
      operationId: getObservability
      tags: [admin]
      summary: Admin observability snapshot
      responses:
        "200":
          description: Observability metrics, alerts, and pipeline timing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservabilitySnapshot"

  /topics:
    get:
      operationId: listTopics
      tags: [topics]
      summary: List all topics
      responses:
        "200":
          description: List of topics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topic"
    post:
      operationId: createTopic
      tags: [topics]
      summary: Create a new topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTopicBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"

  /topics/{id}:
    get:
      operationId: getTopic
      tags: [topics]
      summary: Get topic by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Topic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateTopic
      tags: [topics]
      summary: Update a topic
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTopicBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
    delete:
      operationId: deleteTopic
      tags: [topics]
      summary: Delete a topic
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /claims/{id}/synthesis:
    get:
      operationId: getClaimSynthesis
      tags: [synthesis]
      summary: Get the synthesis record for a claim
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Claim synthesis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimSynthesis"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /evidence-links:
    get:
      operationId: listEvidenceLinks
      tags: [evidence]
      summary: List evidence links with optional filtering
      parameters:
        - name: claimId
          in: query
          schema:
            type: ["integer", "null"]
        - name: studyId
          in: query
          schema:
            type: ["integer", "null"]
        - name: direction
          in: query
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
        - name: offset
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of evidence links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvidenceLink"
    post:
      operationId: createEvidenceLink
      tags: [evidence]
      summary: Create a new evidence link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEvidenceLinkBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceLink"

  /evidence-links/{id}:
    patch:
      operationId: updateEvidenceLink
      tags: [evidence]
      summary: Update an evidence link
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEvidenceLinkBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceLink"
    delete:
      operationId: deleteEvidenceLink
      tags: [evidence]
      summary: Delete an evidence link
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /topics/stats:
    get:
      operationId: getTopicsStats
      tags: [topics]
      summary: Get overview stats across all topics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicsStats"

  /papers:
    get:
      operationId: listPapers
      tags: [papers]
      summary: List papers with optional filtering
      parameters:
        - name: topicId
          in: query
          schema:
            type: ["integer", "null"]
        - name: methodologyType
          in: query
          schema:
            type: ["string", "null"]
        - name: evidenceQuality
          in: query
          schema:
            type: ["string", "null"]
        - name: replicationStatus
          in: query
          schema:
            type: ["string", "null"]
        - name: domain
          in: query
          description: Filter papers by topic domain (e.g. "Endocrinology")
          schema:
            type: ["string", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
        - name: offset
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of papers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PapersListResponse"
    post:
      operationId: createPaper
      tags: [papers]
      summary: Create a new paper
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaperBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paper"

  /papers/{id}:
    get:
      operationId: getPaper
      tags: [papers]
      summary: Get paper by ID with its claims
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Paper with claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updatePaper
      tags: [papers]
      summary: Update a paper
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePaperBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paper"
    delete:
      operationId: deletePaper
      tags: [papers]
      summary: Delete a paper
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /claims:
    get:
      operationId: listClaims
      tags: [claims]
      summary: List claims with optional filtering
      parameters:
        - name: topicId
          in: query
          schema:
            type: ["integer", "null"]
        - name: consensusStatus
          in: query
          schema:
            type: ["string", "null"]
        - name: evidenceQuality
          in: query
          schema:
            type: ["string", "null"]
        - name: direction
          in: query
          schema:
            type: ["string", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
        - name: offset
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of claims with synthesis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimsListResponse"
    post:
      operationId: createClaim
      tags: [claims]
      summary: Create a new claim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClaimBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"

  /claims/{id}:
    get:
      operationId: getClaim
      tags: [claims]
      summary: Get claim by ID with full evidence
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Claim with full evidence breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateClaim
      tags: [claims]
      summary: Update a claim
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClaimBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
    delete:
      operationId: deleteClaim
      tags: [claims]
      summary: Delete a claim
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /studies:
    post:
      operationId: createStudy
      tags: [studies]
      summary: Create a new study
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudyBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Study"

  /studies/{id}:
    get:
      operationId: getStudy
      tags: [studies]
      summary: Get study by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Study
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Study"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateStudy
      tags: [studies]
      summary: Update a study
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudyBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Study"
    delete:
      operationId: deleteStudy
      tags: [studies]
      summary: Delete a study
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /query:
    get:
      operationId: queryKnowledgeBase
      tags: [query]
      summary: Query the knowledge base with natural language
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 500
      responses:
        "200":
          description: Query result with best-matching synthesis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"

  /query/recent:
    get:
      operationId: getRecentActivity
      tags: [query]
      summary: Get recently added claims and papers across all topics
      responses:
        "200":
          description: Recent activity feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentActivity"

  /query/synthesize:
    get:
      operationId: synthesizeQuestion
      tags: [query]
      summary: AI synthesis of a research question — streams SSE events
      description: |
        Returns a Server-Sent Events stream. Each event is a JSON payload:
        - `{"type":"token","data":"..."}` — partial LLM output token
        - `{"type":"result","data":{...}}` — final SynthesisResult after streaming completes
        - `{"type":"cached","data":{...}}` — SynthesisResult served from 24-hour DB cache
        - `{"type":"error","data":"..."}` — error message
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 500
          description: The research question to synthesize
      responses:
        "200":
          description: SSE stream of synthesis events
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /synthesis/{shareId}:
    get:
      operationId: getSharedSynthesis
      tags: [synthesis]
      summary: Fetch a previously synthesized result by its share id (public)
      description: |
        Returns a stored synthesis result keyed by the short slug emitted in
        the SSE `result` event. Public on purpose — anyone with the link can view.
      parameters:
        - name: shareId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stored synthesis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SynthesisResult"
        "400":
          description: Invalid share id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /query/verify:
    post:
      operationId: verifyClaim
      tags: [query]
      summary: Verify a plain-text claim against the knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyClaimBody"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /claims/{id}/contradictions:
    get:
      operationId: getClaimContradictions
      tags: [claims]
      summary: Get the contradiction map for a claim with LLM-generated explanations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contradiction map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContradictionMapResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/ingestion-runs:
    get:
      operationId: listIngestionRuns
      tags: [admin]
      summary: List recent ingestion runs
      parameters:
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of ingestion runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IngestionRun"

  /admin/ingestion-runs/{id}/results:
    get:
      operationId: getIngestionRunResults
      tags: [admin]
      summary: Get papers and claims created during a specific ingestion run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Papers and claims for the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionRunResults"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/ingestion/run:
    post:
      operationId: triggerIngestion
      tags: [admin]
      summary: Trigger an immediate ingestion run
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerIngestionBody"
      responses:
        "200":
          description: Ingestion started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerIngestionResponse"
        "409":
          description: Ingestion already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/ingestion-configs:
    get:
      operationId: listIngestionConfigs
      tags: [admin]
      summary: List ingestion configurations
      responses:
        "200":
          description: List of ingestion configs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IngestionConfig"
    post:
      operationId: createIngestionConfig
      tags: [admin]
      summary: Create a new ingestion config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIngestionConfigBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionConfig"

  /admin/ingestion-configs/{id}:
    patch:
      operationId: updateIngestionConfig
      tags: [admin]
      summary: Update an ingestion config
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIngestionConfigBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionConfig"
    delete:
      operationId: deleteIngestionConfig
      tags: [admin]
      summary: Delete an ingestion config
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /usage/me:
    get:
      operationId: getUsageMe
      tags: [usage]
      summary: Get current user's usage, quota, and global budget status
      responses:
        "200":
          description: Usage summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageMeResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/usage:
    get:
      operationId: getAdminUsage
      tags: [admin]
      summary: Aggregate usage metrics for admins
      responses:
        "200":
          description: Aggregate usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsageSummary"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/usage/reset-budget:
    post:
      operationId: resetUsageBudget
      tags: [admin]
      summary: Admin override — reset today's LLM spend cap
      responses:
        "200":
          description: Reset acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetBudgetResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    CurrentUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        role: { type: string, enum: [user, admin] }
        status: { type: string, enum: [active, suspended] }
        plan: { type: string, description: "Subscription plan placeholder" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, email, role, status, plan, createdAt, updatedAt]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ReadinessResponse:
      type: object
      properties:
        status: { type: string }
        checkedAt: { type: string, format: date-time }
        checks:
          type: object
          properties:
            db:
              type: object
              properties:
                ok: { type: boolean }
                latencyMs: { type: number }
                error: { type: string }
              required: [ok]
            openai:
              type: object
              properties:
                ok: { type: boolean }
                configured: { type: boolean }
                latencyMs: { type: number }
                error: { type: string }
              required: [ok, configured]
          required: [db, openai]
      required: [status, checks, checkedAt]

    VersionInfo:
      type: object
      properties:
        sha: { type: string }
        builtAt: { type: string, nullable: true }
        nodeVersion: { type: string }
        env: { type: string }
      required: [sha, nodeVersion, env]

    ObservabilitySnapshot:
      type: object
      properties:
        generatedAt: { type: string, format: date-time }
        timeseries:
          type: array
          items:
            type: object
            properties:
              ts: { type: string, format: date-time }
              requests: { type: integer }
              errors: { type: integer }
              errorRate: { type: number }
              p95Ms: { type: number }
            required: [ts, requests, errors, errorRate, p95Ms]
        routes:
          type: array
          items:
            type: object
            properties:
              route: { type: string }
