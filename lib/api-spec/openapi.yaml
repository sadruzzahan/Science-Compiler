        uncertaintyScore: { type: integer }
        temporalTrend: { type: string }
        supportingStudies:
          type: array
          items: { $ref: "#/components/schemas/StudySummary" }
        contradictingStudies:
          type: array
          items: { $ref: "#/components/schemas/StudySummary" }
        totalEvidence: { type: integer }
        cached: { type: boolean }
      required:
        - question
        - questionHash
        - consensusStatus
        - synthesisText
        - moderatingVariables
        - methodologicalConcerns
        - uncertaintyScore
        - temporalTrend
        - supportingStudies
        - contradictingStudies
        - totalEvidence
        - cached

    VerifyResult:
      type: object
      properties:
        claim:
          type: string
        verdict:
          type: string
        confidence:
          type: integer
        matchedClaimText:
          type: ["string", "null"]
        matchedClaimId:
          type: ["integer", "null"]
        supportingSummary:
          type: string
        contradictingSummary:
          type: string
      required: [claim, verdict, confidence, supportingSummary, contradictingSummary]

    ContradictionEntry:
      type: object
      properties:
        evidenceLinkId:
          type: integer
        studyId:
          type: integer
        studyTitle:
          type: string
        studyYear:
          type: integer
        studyAuthors:
          type: string
        studyMethodologyType:
          type: string
        studySampleSize:
          type: ["integer", "null"]
        contradictionExplanation:
          type: string
      required:
        - evidenceLinkId
        - studyId
        - studyTitle
        - studyYear
        - studyAuthors
        - studyMethodologyType
        - contradictionExplanation

    BudgetStatus:
      type: object
      properties:
        exhausted: { type: boolean }
        spendUsd: { type: number }
        capUsd: { type: ["number", "null"] }
        retryAfterUtc: { type: string }
        retryAfterSeconds: { type: integer }
      required: [exhausted, spendUsd, retryAfterUtc, retryAfterSeconds]

    UsageMeResponse:
      type: object
      properties:
        plan: { type: string }
        syntheses:
          type: object
          properties:
            todayCount: { type: integer }
            dailyLimit: { type: ["integer", "null"] }
            remaining: { type: ["integer", "null"] }
            resetAtUtc: { type: string }
          required: [todayCount, resetAtUtc]
        budget:
          $ref: "#/components/schemas/BudgetStatus"
      required: [plan, syntheses, budget]

    AdminUsageDay:
      type: object
      properties:
        day: { type: string }
        costUsd: { type: number }
        calls: { type: integer }
      required: [day, costUsd, calls]

    AdminUsageRoute:
      type: object
      properties:
        route: { type: string }
        costUsd: { type: number }
        calls: { type: integer }
      required: [route, costUsd, calls]

    AdminUsageUser:
      type: object
      properties:
        userId: { type: ["string", "null"] }
        costUsd: { type: number }
        calls: { type: integer }
      required: [costUsd, calls]

    AdminUsageSummary:
      type: object
      properties:
        todayUsd: { type: number }
        todayCount: { type: integer }
        capUsd: { type: ["number", "null"] }
        exhausted: { type: boolean }
        byDay:
          type: array
          items: { $ref: "#/components/schemas/AdminUsageDay" }
        byRoute:
          type: array
          items: { $ref: "#/components/schemas/AdminUsageRoute" }
        byUser:
          type: array
          items: { $ref: "#/components/schemas/AdminUsageUser" }
      required: [todayUsd, todayCount, exhausted, byDay, byRoute, byUser]

    ResetBudgetResponse:
      type: object
      properties:
        ok: { type: boolean }
        budget:
          $ref: "#/components/schemas/BudgetStatus"
      required: [ok, budget]

    ContradictionMapResult:
      type: object
      properties:
        claimId:
          type: integer
        claimText:
          type: string
        contradictions:
          type: array
          items:
            $ref: "#/components/schemas/ContradictionEntry"
      required: [claimId, claimText, contradictions]
